name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/test.yml
    with:
      release-tag: ${{ github.ref_name }}

  publish:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/agent-session-commit/
    steps:
      - name: Require the PyPI API token
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN || secrets.PYPI_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "::error::Add PYPI_API_TOKEN (or PYPI_TOKEN) to this repository or its pypi environment."
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Upload the tested distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN || secrets.PYPI_TOKEN }}
          attestations: false
          print-hash: true

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Create release with distribution assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_flags=()
          case "$RELEASE_TAG" in
            *rc[0-9]*|*a[0-9]*|*b[0-9]*|*.dev[0-9]*) release_flags+=(--prerelease) ;;
          esac
          gh release create "$RELEASE_TAG" dist/* --repo "$RELEASE_REPO" --verify-tag --title "$RELEASE_TAG" --generate-notes "${release_flags[@]}"
